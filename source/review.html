<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORVEN — Design Review</title><style>body{margin:0;background:#272628;color:#f1efea;font:14px Arial}header{padding:16px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid #555}button,select,a{font:inherit;padding:10px 14px;border-radius:6px;border:1px solid #666;background:#171719;color:inherit}button{cursor:pointer}.active{background:#B9A189;color:#0B0B0C}main{overflow:auto;padding:24px}iframe{display:block;background:#0B0B0C;border:0;margin:auto;min-height:100vh}small{display:block;padding:0 24px 12px;color:#c4c0bb}</style><header><strong>ORVEN · مراجعة التصميم</strong><label>الصفحة <select id="page"><option value="">Home</option><option value="services/">Services</option><option value="work/">Work</option><option value="about/">About</option><option value="contact/">Contact</option><option value="work/spiky/">Spiky</option><option value="work/future-interiors/">Future Interiors</option><option value="privacy/">Privacy</option></select></label><label>اللغة <select id="language"><option value="ar">العربية</option><option value="en">English</option></select></label><button data-width="1440" class="active">1440px</button><button data-width="390">390px</button><button id="edit">تعديل النص للمعاينة</button><button id="export">تصدير تعديلات المعاينة</button><a id="open" target="_blank">فتح الصفحة</a></header><small>تعديلات هذه اللوحة للمراجعة فقط. المصدر المعتمد والقابل للتحرير في ملفات source/content.json وsource/cases.json. لا تُحفظ بيانات نموذج التواصل في هذه اللوحة.</small><main><iframe id="preview" title="معاينة ORVEN" width="1440"></iframe></main><script>const frame=document.getElementById('preview'),page=document.getElementById('page'),language=document.getElementById('language');let editing=false;function load(){frame.src='/'+language.value+'/'+page.value;document.getElementById('open').href=frame.src}page.onchange=language.onchange=load;document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.width=b.dataset.width;document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('active',x===b))});frame.onload=()=>{frame.height=frame.contentDocument.documentElement.scrollHeight;editing=false;document.getElementById('edit').textContent='تعديل النص للمعاينة'};document.getElementById('edit').onclick=()=>{editing=!editing;frame.contentDocument.querySelectorAll('main h1,main h2,main h3,main p:not(.field-error):not(#form-status),main figcaption').forEach(e=>e.contentEditable=String(editing));document.getElementById('edit').textContent=editing?'إنهاء التعديل':'تعديل النص للمعاينة'};document.getElementById('export').onclick=()=>{const content=Array.from(frame.contentDocument.querySelectorAll('[contenteditable]')).map((e,index)=>({index,text:e.innerText}));const blob=new Blob([JSON.stringify({page:page.value,language:language.value,content},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ORVEN-review-edits.json';a.click();URL.revokeObjectURL(a.href)};load();</script></html>
